<nav class="navbar" id="navbar">
  <div class="logo">
    <img src="assets/img/logo.png" alt="Logo DOS" class="logo-img" />
  </div>

  <ul class="nav-links-container">
    <!-- Notification bell -->
    <li class="nav-links">
      <a href="#" class="fas fa-bell"></a>
    </li>
    
    <!-- Enlaces dinámicos -->
    <li class="nav-links" *ngFor="let data of menu">
      <a [routerLink]="[data.ruta]" 
         class="nav-link"
         routerLinkActive="active" 
         [routerLinkActiveOptions]="{exact: data.ruta === '/'}">
        <i class="{{ data.icono }}"></i>
        <p>{{ data.titulo }}</p>
      </a>
    </li>
    
    <!-- Profile dropdown -->
    <li class="nav-links">
      <div class="profile-dropdown" [class.show]="dropdownAbierto">
        <!-- ✅ CAMBIO: Agregar manejo de error -->
        <!-- <img [src]="Imagen || IconoPerfil" 
          alt="Perfil" 
          class="profile-avatar"
          (click)="toggleDropdown()"
          (error)="onImagenPerfilError($event)"> -->
        
          <img [src]="construirUrlFoto(this.empleado?.fotoPerfilUrl || '', this.empleado?.sexo || '')" 
            class="profile-avatar" id="employeeImage"
            [alt]="this.empleado?.nombre" 
            (click)="toggleDropdown()" 
            (error)="onImageError($event, this.empleado?.sexo || 'M')">

        
        <div class="dropdown-menu" id="profileMenu">
          <div class="dropdown-divider"></div>

          <!-- Nombre del usuario -->
          <label class="label-nombre-navbar">{{ nombreCompletoDisplayVar || 'Usuario' }}</label>

          <a href="#" (click)="logout(); $event.preventDefault()">
            <i class="fas fa-sign-out-alt"></i>
            Cerrar Sesión
          </a>
        </div>

      </div>
    </li>
  </ul>
</nav>
