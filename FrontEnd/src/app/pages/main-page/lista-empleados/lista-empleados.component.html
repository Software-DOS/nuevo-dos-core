<main class="container-main">
  <div id="lista-empleados" class="cap-table">
  <div class="cap-header">
    <div>Foto</div>
    <div>Nombre</div>
    <div>Cédula</div>
    <div>Cargo</div>
    <div>Área</div>
    <div>Certificaciones</div>
  </div>

<div class="cap-row" *ngFor="let empleado of empleados" (click)="navigateToEmployeeCV(empleado.cedula)" style="cursor: pointer;">
      <div><img [src]="empleado.photo" class="employee-photo" [alt]="empleado.nombre"></div>
      <div>{{ empleado.nombre }}</div>
      <div>{{ empleado.cedula }}</div>
      <div>{{ empleado.cargo }}</div>
      <div [ngClass]="getAreaClass(empleado.area)" class="area-badge">{{ empleado.area.toUpperCase() }}</div>
      <div class="certifications-count"><span style="margin-right: 0.5rem;">✓</span>{{ empleado.certificaciones }}</div>
    </div>
</div>

</main>
