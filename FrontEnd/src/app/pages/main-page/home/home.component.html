<div class="construction-container">
  <!-- Decoración Superior (Lazo) -->
  <div class="top-decoration">
    <div class="ribbon"></div>
  </div>

  <!-- Sección del Logo (PRINCIPAL) -->
  <div class="logo-section">
    <div class="logo-container">
      <img [src]="logoEmpresa" 
           alt="Logo Empresa" 
           class="company-logo"
           (error)="onImageError($event)">
    </div>

    <!-- Banner Informativo (BAJO EL LOGO) -->
    <div class="construction-banner">
      <div class="banner-content">
        <!-- Animación de Trabajadores -->
        <div class="workers-animation">
          <div class="worker">🚧</div>
        </div>

        <!-- Icono de Construcción -->
        <div class="construction-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
          </svg>
        </div>
        
        <!-- Texto Informativo -->
        <div class="banner-text">        
          <span class="info-text">Bienvenido...!!!  •  Sitio en construcción  •  ¡Evaluación disponible!</span>
          <span class="separator">•</span>
          <span class="version-badge">v1.0</span>        
        </div>
        
        <!-- Icono de Construcción -->
        <div class="construction-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
          </svg>
        </div>

        <!-- Animación de Trabajadores -->
        <div class="workers-animation">
          <div class="worker">🚧</div>
        </div>
      </div>
    </div>
  </div>
</div>
